<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient - Login/Register</title>

    <link rel="stylesheet" href="patient-login.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="patient-header">
      <div class="patient-header-container">
        <a href="index.html" class="patient-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="patient-help">
          Need help?
          <span>+91 7906 0905 74</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="patient-login-section">
      <div class="patient-page-container">
        <!-- BACK -->

        <a href="login.html" class="back-link">
          <i class="fa-solid fa-chevron-left"></i>
          Back to hospitalbeds.com
        </a>

        <div class="patient-login-wrapper">
          <!-- ================= LEFT FORM ================= -->

          <div class="patient-login-card">
            <div class="patient-form-content">
              <span class="welcome-text"> WELCOME TO HOSPITALBEDS </span>

              <h1>
                Find the Right Care,<br />
                With Confidence
              </h1>

              <p class="patient-description">
                Access trusted hospitals, healthcare services, surgery packages
                and diagnostic care — all in one place.
              </p>

              <!-- MOBILE NUMBER -->

              <label for="mobileNumber"> Mobile Number </label>

              <div class="mobile-input">
                <span class="country-code"> +91 </span>

                <input
                  type="tel"
                  id="mobileNumber"
                  placeholder="Enter mobile number"
                />
              </div>

              <!-- CONTINUE -->

              <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'patient-otp.html'"
            >
              Continue
            </button>

              <p class="terms-text">
                By continuing, you agree to our
                <a href="#">Terms & Conditions</a>
                and
                <a href="#">Privacy Policy</a>.
              </p>
            </div>
          </div>

          <!-- ================= RIGHT IMAGE ================= -->

          <div class="patient-image">
            <img src="assets/patient-login.jpg" alt="Hospital Care" />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
