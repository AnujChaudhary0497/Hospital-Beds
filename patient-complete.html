<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient Complete</title>

    <link rel="stylesheet" href="patient-complete.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="patient-header">
      <div class="patient-header-container">
        <a href="index.html" class="patient-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="patient-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= COMPLETE SECTION ================= -->

    <main class="complete-section">
      <div class="complete-container">
        <!-- SUCCESS ICON -->

        <div class="success-icon">
          <i class="fa-solid fa-check"></i>
        </div>

        <!-- LABEL -->

        <span class="complete-label"> REGISTRATION COMPLETE </span>

        <!-- HEADING -->

        <h1>Your Patient Profile Is Ready</h1>

        <!-- DESCRIPTION -->

        <p class="complete-description">
          You can now explore hospitals, healthcare services and manage your
          care journey.
        </p>

        <!-- DASHBOARD BUTTON -->

       <button
              type="button"
              class="dashboard-btn"
              onclick="window.location.href = 'index.html'"
            >
            Go to Patient Dashboard
            </button>
          
        </a>
      </div>
    </main>
  </body>
</html>
