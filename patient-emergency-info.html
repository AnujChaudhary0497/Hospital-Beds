<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient - Emergency Info</title>

    <link rel="stylesheet" href="patient-emergency-info.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="patient-header">
      <div class="patient-header-container">
        <a href="index.html" class="patient-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="patient-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="profile-section">
      <div class="profile-container">
        <!-- ================= STEPS ================= -->

        <div class="profile-steps">
          <!-- STEP 1 -->

          <div class="profile-step completed">
            <div class="step-number">01</div>

            <span>Personal Information</span>
          </div>

          <!-- STEP 2 -->

          <div class="profile-step completed">
            <div class="step-number">02</div>

            <span>Health Information</span>
          </div>

          <!-- STEP 3 -->

          <div class="profile-step active">
            <div class="step-number">03</div>

            <span>Emergency Contact</span>
          </div>
        </div>

        <!-- ================= EMERGENCY CARD ================= -->

        <div class="profile-card">
          <span class="profile-label"> PATIENT PROFILE </span>

          <h1>Add an Emergency Contact</h1>

          <p class="profile-description">
            Provide a trusted contact who can be reached when immediate
            assistance is required.
          </p>

          <form>
            <!-- CONTACT NAME -->

            <div class="form-group">
              <label> Contact Name </label>

              <input type="text" placeholder="Enter contact name" />
            </div>

            <!-- RELATIONSHIP -->

            <div class="form-group">
              <label> Relationship </label>

              <select>
                <option value="" selected disabled>Select relationship</option>

                <option>Father</option>
                <option>Mother</option>
                <option>Spouse</option>
                <option>Brother</option>
                <option>Sister</option>
                <option>Son</option>
                <option>Daughter</option>
                <option>Other</option>
              </select>
            </div>

            <!-- CONTACT NUMBER -->

            <div class="form-group">
              <label> Contact Number </label>

              <input type="tel" placeholder="Enter contact number" />
            </div>

            <!-- CONTINUE -->

            <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'patient-complete.html'"
            >
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
