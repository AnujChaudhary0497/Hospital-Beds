<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient - Health Info</title>

    <link rel="stylesheet" href="patient-health-info.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="patient-header">
      <div class="patient-header-container">
        <a href="index.html" class="patient-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="patient-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="profile-section">
      <div class="profile-container">
        <!-- ================= STEPS ================= -->

        <div class="profile-steps">
          <!-- STEP 1 -->

          <div class="profile-step completed">
            <div class="step-number">01</div>

            <span>Personal Information</span>
          </div>

          <!-- STEP 2 -->

          <div class="profile-step active">
            <div class="step-number">02</div>

            <span>Health Information</span>
          </div>

          <!-- STEP 3 -->

          <div class="profile-step">
            <div class="step-number">03</div>

            <span>Emergency Contact</span>
          </div>
        </div>

        <!-- ================= HEALTH CARD ================= -->

        <div class="profile-card">
          <span class="profile-label"> PATIENT PROFILE </span>

          <h1>Your Health Information</h1>

          <p class="profile-description">
            Share relevant health information to help us provide a more informed
            healthcare experience.
          </p>

          <form>
            <!-- MEDICAL INFORMATION -->

            <div class="form-group">
              <label> Medical Information </label>

              <textarea
                placeholder="Mention existing conditions, allergies, medications or other relevant health information."
              ></textarea>
            </div>

            <!-- NOTE -->

            <p class="form-note">
              You can update this information later from your profile.
            </p>

            <!-- CONTINUE -->

           <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'patient-emergency-info.html'"
            >
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
