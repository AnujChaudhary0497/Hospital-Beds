<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Patient - Personal Info</title>

    <link rel="stylesheet" href="patient-personal-info.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="patient-header">
      <div class="patient-header-container">
        <a href="index.html" class="patient-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="patient-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="profile-section">
      <div class="profile-container">
        <!-- ================= STEPS ================= -->

        <div class="profile-steps">
          <!-- STEP 1 -->

          <div class="profile-step active">
            <div class="step-number">01</div>

            <span>Personal Information</span>
          </div>

          <!-- STEP 2 -->

          <div class="profile-step">
            <div class="step-number">02</div>

            <span>Health Information</span>
          </div>

          <!-- STEP 3 -->

          <div class="profile-step">
            <div class="step-number">03</div>

            <span>Emergency Contact</span>
          </div>
        </div>

        <!-- ================= PROFILE CARD ================= -->

        <div class="profile-card">
          <span class="profile-label"> PATIENT PROFILE </span>

          <h1>Create Your Patient Profile</h1>

          <p class="profile-description">
            Tell us a little about yourself to create your HospitalBeds patient
            profile.
          </p>

          <form>
            <!-- FULL NAME -->

            <div class="form-group">
              <label> Full Name<span>*</span> </label>

              <input type="text" placeholder="Enter your full name" />
            </div>

            <!-- EMAIL -->

            <div class="form-group">
              <label> Email Address<span>*</span> </label>

              <input type="email" placeholder="Enter your email address" />
            </div>

            <!-- AGE + GENDER -->

            <div class="form-row">
              <div class="form-group">
                <label> Age<span>*</span> </label>

                <input type="number" placeholder="Enter your age" />
              </div>

              <div class="form-group">
                <label> Gender<span>*</span> </label>

                <select>
                  <option value="" selected disabled>Select gender</option>

                  <option>Male</option>
                  <option>Female</option>
                  <option>Other</option>
                </select>
              </div>
            </div>

            <!-- CONTINUE -->

            <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'patient-health-info.html'"
            >
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
