<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hospital - Contact Info</title>

    <link rel="stylesheet" href="hospital-contact-details.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="hospital-header">
      <div class="hospital-header-container">
        <a href="index.html" class="hospital-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="hospital-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="hospital-contact-section">
      <div class="hospital-contact-container">
        <!-- ================= STEPS ================= -->

        <div class="hospital-steps">
          <!-- STEP 1 -->

          <div class="hospital-step completed">
            <div class="step-number">01</div>

            <span> Hospital Information </span>
          </div>

          <!-- STEP 2 -->

          <div class="hospital-step completed">
            <div class="step-number">02</div>

            <span> Departments </span>
          </div>

          <!-- STEP 3 -->

          <div class="hospital-step active">
            <div class="step-number">03</div>

            <span> Contact Details </span>
          </div>

          <!-- STEP 4 -->

          <div class="hospital-step">
            <div class="step-number">04</div>

            <span> Facilities &amp; Images </span>
          </div>
        </div>

        <!-- ================= CONTACT CARD ================= -->

        <div class="hospital-contact-card">
          <span class="contact-label"> HOSPITAL REGISTRATION </span>

          <h1>Hospital Contact Details</h1>

          <p class="contact-description">
            Add the primary contact information patients and HospitalBeds teams
            can use to reach your hospital.
          </p>

          <form>
            <!-- CONTACT PERSON -->

            <div class="form-group">
              <label> Contact Person Name </label>

              <input type="text" placeholder="Enter contact person name" />
            </div>

            <!-- CONTACT NUMBER -->

            <div class="form-group">
              <label> Contact Number </label>

              <input type="tel" placeholder="Enter contact number" />
            </div>

            <!-- EMAIL -->

            <div class="form-group">
              <label> Email Address </label>

              <input type="email" placeholder="Enter official contact email" />
            </div>

            <!-- CITY + STATE -->

            <div class="form-row">
              <div class="form-group">
                <label> City </label>

                <select>
                  <option value="" selected disabled>Select city</option>

                  <option>Delhi</option>
                  <option>Noida</option>
                  <option>Gurgaon</option>
                  <option>Ghaziabad</option>
                  <option>Faridabad</option>
                </select>
              </div>

              <div class="form-group">
                <label> State </label>

                <select>
                  <option value="" selected disabled>Select state</option>

                  <option>Delhi</option>
                  <option>Uttar Pradesh</option>
                  <option>Haryana</option>
                  <option>Maharashtra</option>
                  <option>Rajasthan</option>
                </select>
              </div>
            </div>

            <!-- CONTINUE -->

            <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'hospital-facilities.html'"
            >
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
