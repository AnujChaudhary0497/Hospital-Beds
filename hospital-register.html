<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hospital - Hospital Info</title>

    <link rel="stylesheet" href="hospital-register.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="hospital-header">
      <div class="hospital-header-container">
        <a href="index.html" class="hospital-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="hospital-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="hospital-register-section">
      <div class="hospital-register-container">
        <!-- ================= STEPS ================= -->

        <div class="hospital-steps">
          <!-- STEP 1 -->

          <div class="hospital-step active">
            <div class="step-number">01</div>

            <span> Hospital Information </span>
          </div>

          <!-- STEP 2 -->

          <div class="hospital-step">
            <div class="step-number">02</div>

            <span> Departments </span>
          </div>

          <!-- STEP 3 -->

          <div class="hospital-step">
            <div class="step-number">03</div>

            <span> Contact Details </span>
          </div>

          <!-- STEP 4 -->

          <div class="hospital-step">
            <div class="step-number">04</div>

            <span> Facilities &amp; Images </span>
          </div>
        </div>

        <!-- ================= FORM CARD ================= -->

        <div class="hospital-register-card">
          <span class="register-label"> HOSPITAL REGISTRATION </span>

          <h1>Register Your Hospital</h1>

          <p class="register-description">
            Provide your hospital details to create and manage your HospitalBeds
            profile.
          </p>

          <form>
            <!-- HOSPITAL NAME + TYPE -->

            <div class="form-row">
              <div class="form-group">
                <label> Hospital Name<span>*</span> </label>

                <input type="text" placeholder="Enter hospital name" />
              </div>

              <div class="form-group">
                <label> Hospital Type<span>*</span> </label>

                <select>
                  <option value="" selected disabled>
                    Enter hospital type
                  </option>

                  <option>General Hospital</option>

                  <option>Private Hospital</option>

                  <option>Government Hospital</option>

                  <option>Specialty Hospital</option>
                </select>
              </div>
            </div>

            <!-- EMAIL -->

            <div class="form-group">
              <label> Email Address<span>*</span> </label>

              <input type="email" placeholder="Enter official hospital email" />
            </div>

            <!-- PASSWORD -->

            <div class="form-group">
              <label> Password<span>*</span> </label>

              <input type="password" placeholder="Enter your password" />
            </div>

            <!-- CONFIRM PASSWORD -->

            <div class="form-group">
              <label> Confirm Password<span>*</span> </label>

              <input type="password" placeholder="Confirm your password" />
            </div>

            <!-- REGISTRATION NUMBER -->

            <div class="form-group">
              <label> Registration / License Number<span>*</span> </label>

              <input
                type="text"
                placeholder="Enter registration or license number"
              />
            </div>

            <!-- CONTINUE -->

            <button
              type="button"
              class="continue-btn"
              onclick="window.location.href = 'hospital-departments.html'"
            >
              Continue
            </button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
