<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hospital - Facilities Info</title>

    <link rel="stylesheet" href="hospital-facilities.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="hospital-header">
      <div class="hospital-header-container">
        <a href="index.html" class="hospital-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="hospital-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->

    <main class="hospital-facilities-section">
      <div class="hospital-facilities-container">
        <!-- ================= STEPS ================= -->

        <div class="hospital-steps">
          <div class="hospital-step completed">
            <div class="step-number">01</div>

            <span> Hospital Information </span>
          </div>

          <div class="hospital-step completed">
            <div class="step-number">02</div>

            <span> Departments </span>
          </div>

          <div class="hospital-step completed">
            <div class="step-number">03</div>

            <span> Contact Details </span>
          </div>

          <div class="hospital-step active">
            <div class="step-number">04</div>

            <span> Facilities &amp; Images </span>
          </div>
        </div>

        <!-- ================= FACILITIES CARD ================= -->

        <div class="hospital-facilities-card">
          <span class="facilities-label"> HOSPITAL REGISTRATION </span>

          <h1>Facilities &amp; Hospital Images</h1>

          <p class="facilities-description">
            Tell patients about your facilities and add images that represent
            your healthcare environment.
          </p>

          <!-- AVAILABLE FACILITIES -->

          <label class="section-label"> Available Facilities </label>

          <div class="facility-grid">
            <label class="facility-option">
              <input type="checkbox" />
              <span>ICU</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" />
              <span>Emergency Care</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" />
              <span>Pharmacy</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" />
              <span>Laboratory</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" />
              <span>Blood Bank</span>
            </label>

            <label class="facility-option">
              <input type="checkbox" />
              <span>Ambulance</span>
            </label>
          </div>

          <button type="button" class="view-all-btn">
            View All Facilities
          </button>

          <!-- HOSPITAL IMAGES -->

          <label class="section-label images-label"> Hospital Images </label>

          <div class="image-upload-grid">
            <label class="image-upload-box">
              <input type="file" accept="image/*" />

              <i class="fa-solid fa-cloud-arrow-up"></i>

              <span>Hospital</span>
            </label>

            <label class="image-upload-box">
              <input type="file" accept="image/*" />

              <i class="fa-solid fa-cloud-arrow-up"></i>

              <span>Building</span>
            </label>

            <label class="image-upload-box">
              <input type="file" accept="image/*" />

              <i class="fa-solid fa-cloud-arrow-up"></i>

              <span>Infrastructure</span>
            </label>
          </div>

          <!-- CONTINUE -->

          <button
            type="button"
            class="continue-btn"
            onclick="
              window.location.href = 'hospital-registration-complete.html'
            "
          >
            Continue
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
