<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hospital Complete</title>

    <link rel="stylesheet" href="hospital-registration-complete.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="hospital-header">
      <div class="hospital-header-container">
        <a href="index.html" class="hospital-logo">
          <img src="assets/logo.png" alt="Hospital Beds" />
        </a>

        <div class="hospital-help">
          Need help?
          <span>+91 98765 43210</span>
        </div>
      </div>
    </header>

    <!-- ================= COMPLETE ================= -->

    <main class="complete-section">
      <div class="complete-container">
        <!-- SUCCESS ICON -->

        <div class="success-icon">
          <i class="fa-solid fa-check"></i>
        </div>

        <!-- LABEL -->

        <span class="complete-label"> REGISTRATION COMPLETE </span>

        <!-- HEADING -->

        <h1>Your Hospital Profile Is Ready</h1>

        <!-- DESCRIPTION -->

        <p class="complete-description">
          You can now continue to your HospitalBeds dashboard and complete your
          profile.
        </p>

        <!-- DASHBOARD -->

        <a href="#" class="dashboard-btn"> Go to Hospital Dashboard </a>
      </div>
    </main>
  </body>
</html>
